name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urlshortener_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Build with Maven
        run: mvn clean compile -B -q

      - name: Run tests
        run: mvn test -B -q
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/urlshortener_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Build Docker image
        run: docker build -t url-shortener:${{ github.sha }} .

      - name: Verify Docker image health
        run: |
          docker run -d --name test-container \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/urlshortener_test \
            -e SPRING_DATASOURCE_USERNAME=testuser \
            -e SPRING_DATASOURCE_PASSWORD=testpass \
            -e REDIS_URL=redis://localhost:6379 \
            -e APP_BASE_URL=http://localhost:8080 \
            -e JWT_SECRET=ci-test-secret-minimum-32-characters-long \
            --network host \
            url-shortener:${{ github.sha }}
          for attempt in $(seq 1 10); do
            if curl -fsS http://localhost:8080/actuator/health; then
              docker stop test-container
              exit 0
            fi
            sleep 5
          done
          docker logs test-container
          docker stop test-container
          exit 1

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Validate deployment secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || (echo "Missing RENDER_DEPLOY_HOOK_URL" && exit 1)
          test -n "$RENDER_APP_URL" || (echo "Missing RENDER_APP_URL" && exit 1)

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test live deployment
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          for attempt in $(seq 1 24); do
            HEALTH=$(curl -sf "$RENDER_APP_URL/actuator/health" | jq -r '.status' || true)
            if [ "$HEALTH" = "UP" ]; then
              echo "Smoke test passed - deployment healthy"
              exit 0
            fi
            echo "Attempt $attempt: deployment not healthy yet"
            sleep 15
          done
          echo "Smoke test failed - deployment did not become healthy"
          exit 1
