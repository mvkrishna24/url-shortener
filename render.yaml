# Render Blueprint — defines all infrastructure for this service.
# Commit this file to version-control; Render reads it on first deploy.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → "New Blueprint" → connect your repo.
#   3. Render provisions the PostgreSQL database and web service automatically.
#   4. Set REDIS_URL and APP_BASE_URL manually (see DEPLOYMENT.md).

services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free

    # Render builds from the Dockerfile at the repo root.
    dockerfilePath: ./Dockerfile

    # Render sets the PORT env var; Spring Boot reads it via ${PORT:8080}
    # in application-prod.yml.
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ── Database ─────────────────────────────────────────────────────────
      # These are automatically populated from the managed PostgreSQL below.
      - key: DB_HOST
        fromDatabase:
          name: url-shortener-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: url-shortener-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: url-shortener-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: url-shortener-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: url-shortener-db
          property: password

      # ── Redis ────────────────────────────────────────────────────────────
      # Render's managed Redis is a paid add-on.
      # For a free alternative, sign up at https://upstash.com and paste the
      # "Redis URL" (format: rediss://default:xxx@hostname:port) here.
      # Set this value in the Render dashboard under Environment → REDIS_URL.
      - key: REDIS_URL
        sync: false   # placeholder — set manually in Render dashboard

      # ── App config ───────────────────────────────────────────────────────
      # After deploy, replace with your actual https://your-app.onrender.com URL.
      - key: APP_BASE_URL
        sync: false   # set to https://<your-service-name>.onrender.com

      # ── Security ─────────────────────────────────────────────────────────
      # Render generates a cryptographically random 64-char value automatically.
      - key: JWT_SECRET
        generateValue: true

      # JWT expiration is measured in hours by app.jwt.expiry-hours.
      - key: JWT_EXPIRATION
        value: "1"
      - key: SERVER_PORT
        value: "8080"

databases:
  - name: url-shortener-db
    plan: free          # 90-day free trial; upgrade to paid for persistence
    databaseName: urlshortener
    user: urlshortener
