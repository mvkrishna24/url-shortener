# ============================================================
# TEST profile — activated by @ActiveProfiles("test") in test classes.
#
# PostgreSQL: Testcontainers via @ServiceConnection (Spring Boot 3.1+).
#   Annotate a static PostgreSQLContainer field with @Container +
#   @ServiceConnection and Spring auto-wires the datasource URL/creds.
#
# Redis: Use a GenericContainer<>(DockerImageName.parse("redis:7-alpine"))
#   and manually override spring.data.redis.host/port via @DynamicPropertySource.
# ============================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate         # Flyway runs all migrations on the Testcontainers DB; Hibernate validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: none                   # Disable caching in tests to avoid state leakage

  # Exclude Redis auto-configuration so tests don't require a running Redis instance.
  # The cache layer is disabled above; no Redis operations happen in these tests.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    root: WARN
    "[com.vamshi.urlshortener]": DEBUG
