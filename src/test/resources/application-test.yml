# ============================================================
# TEST profile — activated by @ActiveProfiles("test") in test classes.
#
# PostgreSQL: Testcontainers via @ServiceConnection (Spring Boot 3.1+).
# Redis:      Testcontainers GenericContainer with @ServiceConnection.
#             All integration tests extend AbstractIntegrationTest which
#             declares both static containers; @ServiceConnection wires
#             the host/port automatically.
# ============================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate         # Flyway runs all migrations on the Testcontainers DB; Hibernate validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Spring Cache abstraction is not used (we call StringRedisTemplate directly),
  # so 'none' here has no effect on UrlCacheService behaviour.
  cache:
    type: none

# Use small limits so integration tests can trigger 429 quickly (5 requests instead of 100)
app:
  rate-limit:
    unauthenticated-rpm: 5
    authenticated-rpm: 10

logging:
  level:
    root: WARN
    "[com.vamshi.urlshortener]": DEBUG
