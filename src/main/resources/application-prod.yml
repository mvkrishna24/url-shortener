# ============================================================
# PROD profile — activated by SPRING_PROFILES_ACTIVE=prod
#
# Deployed on Render. All secrets come from environment variables.
# No sensitive defaults — the app fails fast if required vars are missing.
# ============================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only verifies
    show-sql: false

  # Redis: accept a full connection URL (Upstash / Render KV format).
  # spring.data.redis.url takes precedence over host/port/password.
  # Format: redis://[:password@]host:port  or  rediss://... for TLS (Upstash)
  data:
    redis:
      url: ${REDIS_URL:redis://${SPRING_REDIS_HOST:localhost}:${SPRING_REDIS_PORT:6379}}
      lettuce:
        pool:
          max-active: 8             # Upstash free tier: 100 max concurrent connections
          max-idle: 4
          min-idle: 1

  # The datasource URL and credentials inherit the proven DB_HOST/DB_PORT/DB_NAME
  # and DB_USER/DB_PASSWORD configuration from application.yml.
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  cache:
    type: redis

  flyway:
    enabled: true
    clean-disabled: true            # NEVER clean in production

# Render sets PORT; this overrides server.port from application.yml.
server:
  port: ${PORT:8080}
  tomcat:
    max-threads: 200
  # Resolve https:// URLs correctly when behind Render's SSL load balancer.
  forward-headers-strategy: NATIVE

# App-level config
app:
  base-url: ${APP_BASE_URL:https://url-shortener-aimk.onrender.com}

# Logging: JSON via logback-spring.xml (springProfile name="prod")
logging:
  level:
    root: INFO
    com.vamshi.urlshortener: INFO

management:
  endpoint:
    health:
      show-details: never           # Never leak internal state to unauthenticated callers
  endpoints:
    web:
      exposure:
        include: health,prometheus   # Keep prometheus for optional Grafana Cloud

# Keep Swagger UI enabled — it's a portfolio feature and part of the live demo.
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
